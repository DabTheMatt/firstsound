<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#151616" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FIELD" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta
      name="description"
      content="FIELD — a browser instrument for sample manipulation."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>FIELD</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var h = window.innerHeight
          var v = window.visualViewport && window.visualViewport.height
          var c = document.documentElement.clientHeight
          if (v && v > h) h = v
          if (c && c > h) h = c
          document.documentElement.style.setProperty('--app-height', Math.round(h) + 'px')
        } catch (e) {}
        try {
          var stored = localStorage.getItem('field.theme') || 'studio-dark'
          var theme = stored
          if (stored === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light-studio'
              : 'studio-dark'
          }
          var known = {
            'studio-dark': 1,
            'midnight-blue': 1,
            oxide: 1,
            forest: 1,
            'light-studio': 1,
            dusk: 1,
            oled: 1,
          }
          if (!known[theme]) theme = 'studio-dark'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme =
            theme === 'light-studio' ? 'light' : 'dark'
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'studio-dark')
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
