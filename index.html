<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="1024x1024" href="./icon-1024.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#151616" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="FIELD" />
    <meta name="apple-mobile-web-app-title" content="FIELD" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Share cards use the name once, as the title. Description is the tagline. Site name is the host, so Slack and Teams do not repeat FIELD. -->
    <meta name="description" content="sound / interference / transformation" />
    <link rel="canonical" href="https://dabthematt.github.io/firstsound/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="dabthematt.github.io" />
    <meta property="og:title" content="FIELD" />
    <meta property="og:description" content="sound / interference / transformation" />
    <meta property="og:url" content="https://dabthematt.github.io/firstsound/" />
    <meta property="og:image" content="https://dabthematt.github.io/firstsound/icon-1024.png" />
    <meta property="og:image:secure_url" content="https://dabthematt.github.io/firstsound/icon-1024.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="FIELD" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="FIELD" />
    <meta name="twitter:description" content="sound / interference / transformation" />
    <meta name="twitter:image" content="https://dabthematt.github.io/firstsound/icon-1024.png" />
    <meta name="twitter:image:alt" content="FIELD" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>FIELD</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var h = window.innerHeight
          var vv = window.visualViewport
          var v = vv && vv.height
          var c = document.documentElement.clientHeight
          var offset = vv && vv.offsetTop > 0 ? Math.round(vv.offsetTop) : 0
          if (v && v > 0) h = v
          else if (c && c > h) h = c
          document.documentElement.style.setProperty('--app-height', Math.round(h) + 'px')
          document.documentElement.style.setProperty('--vv-offset-top', offset + 'px')
        } catch (e) {}
        try {
          var storedLocale = localStorage.getItem('field.uiLocale')
          if (storedLocale === 'pl' || storedLocale === 'en') {
            document.documentElement.lang = storedLocale
          } else if (String(navigator.language || '').toLowerCase().indexOf('pl') === 0) {
            document.documentElement.lang = 'pl'
          }
        } catch (e) {}
        try {
          var stored = localStorage.getItem('field.theme') || 'studio-dark'
          var theme = stored
          var a11y = {}
          try {
            a11y = JSON.parse(localStorage.getItem('field.a11y') || '{}')
          } catch (err) {
            a11y = {}
          }
          var lowVision = stored === 'low-vision' || a11y.lowVision === true
          if (stored === 'low-vision') stored = 'studio-dark'
          theme = stored
          if (stored === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light-studio'
              : 'studio-dark'
          }
          var known = {
            'studio-dark': 1,
            'midnight-blue': 1,
            oxide: 1,
            forest: 1,
            'light-studio': 1,
            oled: 1,
            dusk: 1,
            'pop-art': 1,
            classic: 1,
            energetic: 1,
            'chaos-theory': 1,
            neon: 1,
            manga: 1,
            'black-white': 1,
            noire: 1,
            oscilloscope: 1,
            'soft-slate': 1,
            'warm-paper': 1,
            custom: 1,
          }
          if (!known[theme]) theme = 'studio-dark'
          var light = theme === 'light-studio' || theme === 'manga' || theme === 'warm-paper'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.setAttribute('data-low-vision', lowVision ? 'on' : 'off')
          document.documentElement.style.colorScheme = light ? 'light' : 'dark'
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'studio-dark')
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
