<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Full-bleed square: macOS/Safari apply their own squircle mask.
       Pre-rounded corners double-mask and fray the Dock outline. -->
  <rect width="32" height="32" fill="#1A1A1A"/>
  <circle cx="16" cy="16" r="8" fill="none" stroke="#D4A251" stroke-width="2"/>
  <path d="M16 10v12" stroke="#D4A251" stroke-width="2" stroke-linecap="round"/>
</svg>
